server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # En-tetes de securite (heritent dans toutes les locations : aucun add_header
    # n'est redefini plus bas, sinon nginx abandonnerait l'heritage).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP bloquante : toutes les ressources sont auto-hebergees (polices, AOS, Spline).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    # HSTS : a ajouter au niveau du reverse proxy (TLS) une fois HTTPS valide confirme.

    # Cache des assets statiques (expires genere Cache-Control)
    location ~* \.(js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|mp4|webm)$ {
        expires 30d;
    }

    # Sert la galerie et chaque mini-site (/brf/, /flyhigh/, /robotech/, /tract/)
    location / {
        try_files $uri $uri/ =404;
    }
}
