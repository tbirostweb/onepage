server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # En-tetes de securite (heritent dans toutes les locations : aucun add_header
    # n'est redefini plus bas, sinon nginx abandonnerait l'heritage).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP en Report-Only : Robotech charge AOS (unpkg), Spline (unpkg + prod.spline.design)
    # et Google Fonts. A passer en Content-Security-Policy apres auto-hebergement/validation.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://unpkg.com 'wasm-unsafe-eval'; style-src 'self' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://unpkg.com https://prod.spline.design; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    # HSTS : a ajouter au niveau du reverse proxy (TLS) une fois HTTPS valide confirme.

    # Cache des assets statiques (expires genere Cache-Control)
    location ~* \.(js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|mp4|webm)$ {
        expires 30d;
    }

    # Sert la galerie et chaque mini-site (/brf/, /flyhigh/, /robotech/, /tract/)
    location / {
        try_files $uri $uri/ =404;
    }
}
